services:
  vuln:
    build:
      context: .
      args:
        NEXT_VERSION: "16.4.0"
    image: nextjs-use-cache-rce:16.4.0
    container_name: ucc-vuln
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  patched:
    build:
      context: .
      args:
        NEXT_VERSION: "16.4.1"
    image: nextjs-use-cache-rce:16.4.1
    container_name: ucc-patched
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
